# =====================================================================
# Nginx — 한성금거래소
#   hanseongge.com      → Next.js (127.0.0.1:3000)
#   api.hanseongge.com  → Spring Boot (127.0.0.1:8080)
#
# 인증서는 certbot 또는 NCP Certificate Manager 로 발급한다 (TODO A-5).
# =====================================================================

# ⚠️ HTTP/2 는 `listen ... http2` 로 켠다. 별도 지시자인 `http2 on;` 은 nginx
#    1.25.1 에서 생겼는데 Ubuntu 24.04 는 1.24.0 을 쓴다 — 그 형태를 쓰면
#    "unknown directive" 로 nginx 가 아예 뜨지 않는다.

# --- Rate Limit 존 (설계서 §15) ---
limit_req_zone $binary_remote_addr zone=login_zone:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=pay_zone:10m    rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m    rate=120r/m;

# --- HTTP → HTTPS ---
server {
    listen 80;
    server_name hanseongge.com www.hanseongge.com api.hanseongge.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# =====================================================================
# www → apex (301)
#
# 두 주소가 같은 내용을 내면 <b>중복 콘텐츠</b>가 된다. 검색엔진이 신호를 둘로 쪼개고
# 대표 주소를 임의로 고른다 — 이 프로젝트가 Next.js 를 고른 첫 번째 이유가 SEO 라
# 그냥 둘 수 없다.
#
# 대표는 apex 다. NEXT_PUBLIC_SITE_URL(OG 태그·사이트맵)이 이미 apex 를 말하고 있어,
# 여기서 www 를 대표로 잡으면 두 곳이 서로 다른 주소를 가리키게 된다.
#
# www 를 없애지 않고 리다이렉트로 두는 이유 — 사람들이 습관으로 www 를 치고, 예전
# 명함·인쇄물에 www 가 박혀 있을 수 있다. 없으면 그 주소가 오류 화면이 된다.
# =====================================================================
server {
    listen 443 ssl http2;
    server_name www.hanseongge.com;

    # 리다이렉트도 https 라 인증서가 www 를 포함해야 한다
    # (certbot 발급 시 -d hanseongge.com -d www.hanseongge.com)
    ssl_certificate     /etc/letsencrypt/live/hanseongge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hanseongge.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://hanseongge.com$request_uri;
}

# =====================================================================
# 쇼핑몰
# =====================================================================
server {
    listen 443 ssl http2;
    server_name hanseongge.com;

    ssl_certificate     /etc/letsencrypt/live/hanseongge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hanseongge.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Next.js 정적 자산은 길게 캐시
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 관리자 화면 — 검색 노출만 막는다. 접근 보호는 백엔드의 비밀번호 + OTP 가 맡는다.
    location /admin {
    # IP 로 막지 않는다 (2026-09-15 결정). 금값이 급변하면 관리자가 휴대폰으로 시세를
    #   고쳐야 하는데 휴대폰 IP 는 계속 바뀐다. 대신 백엔드가 비밀번호 + 휴대폰 OTP 를
    #   요구한다(ADMIN_OTP_REQUIRED=true). TODO A-10 참조.
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# =====================================================================
# API
# =====================================================================
server {
    listen 443 ssl http2;
    server_name api.hanseongge.com;

    ssl_certificate     /etc/letsencrypt/live/api.hanseongge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hanseongge.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 20m;

    # 관리자 API — 요청 속도만 제한한다 (인증은 audience=admin 토큰 + OTP)
    location /api/admin/ {
    # IP 로 막지 않는다 (2026-09-15 결정). 금값이 급변하면 관리자가 휴대폰으로 시세를
    #   고쳐야 하는데 휴대폰 IP 는 계속 바뀐다. 대신 백엔드가 비밀번호 + 휴대폰 OTP 를
    #   요구한다(ADMIN_OTP_REQUIRED=true). TODO A-10 참조.
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    # ⚠️ 위 블록의 allow/deny 가 여기에 <b>상속되지 않는다.</b> nginx 는 정확일치(=)를
    # 먼저 고르고 거기서 탐색을 끝내므로, 이 블록은 /api/admin/ 의 규칙을 물려받지
    # 않는다. 빠뜨리면 무차별 대입의 유일한 표적인 로그인 엔드포인트만 열려 있게 된다.
    location = /api/admin/auth/login {
    # IP 로 막지 않는다 (2026-09-15 결정). 금값이 급변하면 관리자가 휴대폰으로 시세를
    #   고쳐야 하는데 휴대폰 IP 는 계속 바뀐다. 대신 백엔드가 비밀번호 + 휴대폰 OTP 를
    #   요구한다(ADMIN_OTP_REQUIRED=true). TODO A-10 참조.
        limit_req zone=login_zone burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    # 결제 콜백 — PG 사 IP 허용목록 (설계서 §11.2 검증 3종 중 ②)
    location /api/v1/payments/callback/ {
        # allow  <PG사 통지 IP 대역>;   # TODO A-3 계약 후 기입
        # deny   all;
        limit_req zone=pay_zone burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    # Swagger / Actuator 는 운영에서 애플리케이션이 이미 끄지만, 경로 자체를 막아 한 겹 더 둔다
    location ~ ^/(swagger-ui|api-docs|actuator) {
        return 404;
    }

    location / {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
