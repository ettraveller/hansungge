# =====================================================================
# 공통 설정 — 모든 프로파일에 적용된다.
#
# 원칙: 민감정보(DB 비밀번호, OAuth Secret, JWT Secret)를 이 파일에 쓰지 않는다.
#       전부 환경변수로 주입한다.
# 프로파일: local(개발자 PC) / dev(NCP 개발) / prod(NCP 운영)
# =====================================================================
spring:
  application:
    name: hanseongge-api

  profiles:
    default: local

  autoconfigure:
    exclude:
      # 기본 인메모리 사용자(랜덤 비밀번호) 자동생성을 막는다.
      # 이 서비스의 인증 주체는 OAuth2 사용자와 admin_users 뿐이며,
      # 정체불명의 계정이 컨텍스트에 존재하는 상태 자체를 만들지 않는다.
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000

  jpa:
    open-in-view: false            # OSIV 비활성 — 트랜잭션 경계를 Service 로 고정
    hibernate:
      ddl-auto: validate           # 스키마의 유일한 소유자는 Flyway. Hibernate 가 만들지 않는다
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework   # Nginx 프록시 뒤에서 실제 클라이언트 IP/스킴 인식
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# API 문서는 기본이 '차단'이다. local/dev 프로파일에서만 명시적으로 연다.
#
# 주의: SwaggerConfig(@Profile({"local","dev"}))만으로는 부족하다. 그 클래스는 OpenAPI
# 메타데이터 빈만 제공할 뿐이고, springdoc 자동설정은 별개로 /api-docs 를 계속 서빙한다.
# 그래서 기본값을 false 로 두어, 새 프로파일이 추가돼도 문서가 딸려 열리지 않게 한다.
springdoc:
  api-docs:
    enabled: false
    path: /api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# --- 애플리케이션 고유 설정 ---
app:
  cors:
    # 콤마 구분. 운영에서는 실제 도메인만 허용한다
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  admin-init:
    # 값이 없으면 최초 관리자 생성을 건너뛴다 (WARN 로그).
    # 기본 계정을 코드에 박아두지 않기 위해 의도적으로 빈 값이 기본이다.
    id: ${ADMIN_INIT_ID:}
    password: ${ADMIN_INIT_PASSWORD:}
  jwt:
    # 비어 있으면 local/test 한정으로 기동 시 1회용 랜덤 키를 만든다(WARN).
    # prod 는 application-prod.yml 에서 기본값 없이 선언되므로 미주입 시 기동 실패한다.
    secret: ${JWT_SECRET:}
    issuer: hanseongge
    admin-access-ttl-minutes: ${JWT_ADMIN_ACCESS_TTL_MINUTES:30}
    admin-refresh-ttl-hours: ${JWT_ADMIN_REFRESH_TTL_HOURS:8}
    # 회원은 관리자보다 Refresh 수명이 훨씬 길다. 쇼핑몰에서 매번 재로그인을 요구하면
    # 이탈이 크고, 회원 Refresh 는 DB 에 남아 즉시 회수할 수 있어 위험이 낮다.
    user-access-ttl-minutes: ${JWT_USER_ACCESS_TTL_MINUTES:30}
    user-refresh-ttl-days: ${JWT_USER_REFRESH_TTL_DAYS:14}
  oauth:
    # 제공자 콘솔에 등록한 콜백 주소와 글자 하나까지 같아야 한다.
    # 최종 주소는 {redirect-base-url}/{google|naver|kakao} 다.
    redirect-base-url: ${OAUTH_REDIRECT_BASE_URL:http://localhost:3000/auth/callback}
    state-ttl-minutes: ${OAUTH_STATE_TTL_MINUTES:10}
    sign-up-token-ttl-minutes: ${OAUTH_SIGNUP_TTL_MINUTES:15}
    # 외부 서버가 느릴 때 로그인 요청이 톰캣 스레드를 붙잡지 않도록 반드시 준다.
    connect-timeout-seconds: ${OAUTH_CONNECT_TIMEOUT:5}
    read-timeout-seconds: ${OAUTH_READ_TIMEOUT:8}
    # 개발은 http 라 Secure 를 켜면 쿠키가 저장되지 않는다. 운영은 prod 에서 true 다.
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    refresh-cookie-domain: ${REFRESH_COOKIE_DOMAIN:}
    # 앱 등록·검수(TODO A-4)가 끝난 제공자만 값이 채워진다.
    # 비어 있으면 그 제공자는 "사용 불가"로 표시될 뿐 기동은 정상이다.
    google:
      client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
      client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
    naver:
      client-id: ${OAUTH_NAVER_CLIENT_ID:}
      client-secret: ${OAUTH_NAVER_CLIENT_SECRET:}
    kakao:
      client-id: ${OAUTH_KAKAO_CLIENT_ID:}
      client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:}
  admin-security:
    max-login-failures: ${ADMIN_MAX_LOGIN_FAILURES:5}
    login-rate-per-minute: ${ADMIN_LOGIN_RATE_PER_MINUTE:10}
    # 관리자 2단계 인증. 휴대폰으로도 관리 화면을 쓰므로 IP 제한 대신 이것으로 막는다.
    otp-required: ${ADMIN_OTP_REQUIRED:true}
    max-otp-failures: ${ADMIN_MAX_OTP_FAILURES:5}
    # 비우면 JWT 서명키에서 파생한다 (AdminOtpCipher).
    otp-encryption-key: ${ADMIN_OTP_ENCRYPTION_KEY:}

logging:
  level:
    root: INFO
    com.hanseongge: DEBUG
