# =====================================================================
# prod — NCP 운영 서버.
#
# 모든 값이 환경변수로만 주입된다. 기본값(:-)을 두지 않는다 —
# 환경변수를 빠뜨리면 조용히 잘못된 값으로 뜨는 대신 기동에 실패해야 한다.
# 주입 방법: systemd EnvironmentFile=/etc/hanseongge/api.env (권한 640)
# =====================================================================
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      leak-detection-threshold: 30000

  jpa:
    properties:
      hibernate:
        format_sql: false

# JWT 서명키는 기본값을 두지 않는다. 미주입 시 기동이 실패해야 한다 —
# 랜덤 키로 조용히 뜨면 재기동마다 전 관리자가 로그아웃되고, 그 사실을 아무도 모른다.
app:
  jwt:
    secret: ${JWT_SECRET}
  oauth:
    # 운영 콜백 주소. 제공자 콘솔 등록값과 일치해야 한다.
    redirect-base-url: ${OAUTH_REDIRECT_BASE_URL}
    # 운영은 HTTPS 전용이다. Secure 없는 장기 세션 쿠키는 평문으로 새어 나간다.
    refresh-cookie-secure: true
    # www 와 api 가 서브도메인으로 갈리므로 등록 도메인을 준다 —
    # 그래야 같은 사이트로 취급되어 SameSite=Lax 쿠키가 API 요청에 실린다.
    refresh-cookie-domain: ${REFRESH_COOKIE_DOMAIN}
    # ⚠️ 기본값을 두지 않는다. 미주입 시 조용히 도는 대신 기동이 실패해야 한다 (설계서 §14.4).
    google:
      client-id: ${OAUTH_GOOGLE_CLIENT_ID}
      client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET}
    naver:
      client-id: ${OAUTH_NAVER_CLIENT_ID}
      client-secret: ${OAUTH_NAVER_CLIENT_SECRET}
    kakao:
      client-id: ${OAUTH_KAKAO_CLIENT_ID}
      client-secret: ${OAUTH_KAKAO_CLIENT_SECRET}

  # 본인인증 — 간편인증 (TODO E-4).
  #
  # 비어 있으면 자체(휴대폰) 가입과 비밀번호 찾기가 닫힌다. 소셜 가입·로그인은 된다. 계약이 끝나면 INICIS.
  # ⚠️ MOCK 은 넣지 않는다 — 아무것도 확인하지 않는 목이라, 운영에서 MOCK 이면 기동이 실패한다.
  # IDENTITY_HASH_PEPPER 가 비어 있어도 본인인증이 꺼진다. 한 번 정하면 바꾸지 않는다.
  identity:
    provider: ${IDENTITY_PROVIDER:}
    hash-pepper: ${IDENTITY_HASH_PEPPER:}
    callback-url: ${IDENTITY_CALLBACK_URL:https://api.hanseongge.com/api/v1/auth/identity/return}
    return-page-url: ${IDENTITY_RETURN_PAGE_URL:https://hanseongge.com/auth/identity}

  # 가입·로그인 정책. 비밀값이 아니라 전부 정책값이라 기본값을 둔다 —
  # 빠뜨렸다고 기동을 막을 이유가 없고, 막으면 배포만 어려워진다.
  sign-up:
    code-ttl-minutes: ${SIGNUP_CODE_TTL_MINUTES:5}
    code-max-attempts: ${SIGNUP_CODE_MAX_ATTEMPTS:5}
    sms-hourly-limit: ${SIGNUP_SMS_HOURLY_LIMIT:5}
    identity-ttl-minutes: ${SIGNUP_IDENTITY_TTL_MINUTES:10}
    max-login-failures: ${SIGNUP_MAX_LOGIN_FAILURES:5}
    auth-rate-per-minute: ${SIGNUP_AUTH_RATE_PER_MINUTE:10}

  # 메일 (TODO E-5).
  #
  # ⚠️ 여기는 기본값을 둔다. 소셜 로그인 클라이언트와 같은 판단이다 — 비어 있으면
  # 기동은 되되 그 기능만 죽고, 기동 로그에 무엇이 없는지가 남는다. 메일이 없다고
  # 시세 조회까지 멈추는 것이 더 나쁘다. 대신 발송 시점에 명확히 실패한다.
  mail:
    access-key: ${APP_MAIL_ACCESS_KEY:}
    secret-key: ${APP_MAIL_SECRET_KEY:}
    from-address: ${APP_MAIL_FROM_ADDRESS:}
    from-name: ${APP_MAIL_FROM_NAME:한성금거래소}

# 운영에서 Swagger / API 문서 전면 차단 (설계서 §15).
# SwaggerConfig 자체가 @Profile({"local","dev"}) 이라 로드되지 않지만,
# springdoc 자동설정까지 확실히 끄고 Nginx 도 해당 경로를 404 로 막는다 — 3중 차단.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Actuator 는 health 만, 그것도 내부 포트로만 노출
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: ${SERVER_PORT:8080}
  # Nginx 만 바라보므로 루프백 바인딩 (설계서 §14)
  address: ${SERVER_ADDRESS:127.0.0.1}

logging:
  level:
    root: INFO
    com.hanseongge: INFO
    org.hibernate.SQL: WARN
  file:
    name: ${LOG_PATH:/var/log/hanseongge}/api.log
  logback:
    rollingpolicy:
      max-history: 30
      max-file-size: 100MB
