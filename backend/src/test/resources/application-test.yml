# =====================================================================
# test — 자동화 테스트 전용.
#
# DataSource URL 은 임베디드 PostgreSQL 이 기동된 뒤 @DynamicPropertySource 로 주입된다
# (EmbeddedPostgresSupport). 여기에 접속 정보를 두지 않는 이유는, 운영 DB 주소가
# 테스트 설정에 실수로 남는 사고를 원천 차단하기 위해서다.
# =====================================================================
spring:
  datasource:
    hikari:
      # 느린 장비 대비 — EmbeddedPostgresSupport.STARTUP_WAIT 과 같은 이유다.
      #
      # 실제로 겪었다(2026-09-03): PostgreSQL 은 정상 기동했는데 그 다음에
      #   "Connection is not available, request timed out after 5011ms"
      #   → java.net.SocketTimeoutException: Read timed out
      # 으로 Flyway 가 첫 커넥션을 못 얻어 통합테스트가 전부 무너졌다.
      #
      # EDR 이 프로세스 실행마다 검사하는 장비에서는 PostgreSQL 이 커넥션마다 백엔드
      # 프로세스를 fork 하는 비용이 커진다. 기동만 넉넉히 기다려서는 부족하고,
      # 붙는 시간도 함께 늘려야 한다.
      #
      # 정상 장비에서는 즉시 붙어 이 값에 닿지 않는다.
      connection-timeout: 60000
      validation-timeout: 20000

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

app:
  admin-init:
    id: ${ADMIN_INIT_ID:}
    password: ${ADMIN_INIT_PASSWORD:}
  # 관리자 로그인이 필요한 테스트 대부분은 OTP 와 무관하다. OTP 흐름은
  # AdminOtpIntegrationTest 가 이 값을 켜고 따로 검증한다.
  admin-security:
    otp-required: false
  sign-up:
    # IP 단위 Rate Limit 을 테스트에서는 사실상 풀어 둔다.
    #
    # 필터는 IP 로 버킷을 잡는데 테스트는 전부 같은 IP 에서 돈다. 운영 기본값(10/분)을
    # 그대로 쓰면 인증 관련 호출이 열 번을 넘는 순간 그 뒤가 전부 429 가 되고,
    # 실패는 무관한 테스트에서 난다 — 원인을 찾기 어려운 종류다.
    #
    # 한도 자체를 검증하는 테스트는 @TestPropertySource 로 자기 값을 내려 쓴다
    # (AdminLoginRateLimitIntegrationTest 가 3 으로 둔다). 그래서 여기를 올려도
    # 그 검증은 그대로 남는다.
    #
    # 번호·주소마다 거는 쿨다운은 VerificationCodeService 쪽이라 여기와 무관하다 —
    # PhoneCodeLoginIntegrationTest 가 보는 429 는 그쪽이다.
    auth-rate-per-minute: 10000
  # 판정 키(CI 해시)용 비밀값. UserTestFixtures.TEST_PEPPER 와 같아야 한다 — 픽스처가 만든 회원의
  # 판정 키와 스텁 본인인증이 만든 키가 같은 사람에서 일치해야 중복가입·비밀번호 찾기가 시험된다.
  identity:
    hash-pepper: test-pepper-for-integration-tests-only-0000

logging:
  level:
    root: WARN
    com.hanseongge: INFO
    org.flywaydb: INFO
