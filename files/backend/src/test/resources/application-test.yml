# =====================================================================
# test — 자동화 테스트 전용.
#
# DataSource URL 은 임베디드 PostgreSQL 이 기동된 뒤 @DynamicPropertySource 로 주입된다
# (EmbeddedPostgresSupport). 여기에 접속 정보를 두지 않는 이유는, 운영 DB 주소가
# 테스트 설정에 실수로 남는 사고를 원천 차단하기 위해서다.
# =====================================================================
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

app:
  admin-init:
    id: ${ADMIN_INIT_ID:}
    password: ${ADMIN_INIT_PASSWORD:}
  market-price:
    scheduler:
      # 테스트 중 백그라운드 수집 스레드가 DB 를 건드리면 재현되지 않는 실패가 생긴다.
      # 수집 로직은 테스트가 직접 호출해서 검증한다.
      enabled: false
    krx:
      enabled: false

logging:
  level:
    root: WARN
    com.hanseongge: INFO
    org.flywaydb: INFO
