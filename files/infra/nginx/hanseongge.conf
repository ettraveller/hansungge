# =====================================================================
# Nginx — 한성금거래소
#   hanseongge.com      → Next.js (127.0.0.1:3000)
#   api.hanseongge.com  → Spring Boot (127.0.0.1:8080)
#
# 인증서는 certbot 또는 NCP Certificate Manager 로 발급한다 (TODO A-5).
# =====================================================================

# --- Rate Limit 존 (설계서 §15) ---
limit_req_zone $binary_remote_addr zone=login_zone:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=pay_zone:10m    rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m    rate=120r/m;

# --- HTTP → HTTPS ---
server {
    listen 80;
    server_name hanseongge.com www.hanseongge.com api.hanseongge.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# =====================================================================
# 쇼핑몰
# =====================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name hanseongge.com www.hanseongge.com;

    ssl_certificate     /etc/letsencrypt/live/hanseongge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hanseongge.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Next.js 정적 자산은 길게 캐시
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 관리자 화면 — 고정 IP 에서만 접근 (설계서 §15)
    location /admin {
        # allow  <사무실 고정 IP>;      # TODO: 운영 배포 전 실제 IP 기입
        # deny   all;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# =====================================================================
# API
# =====================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name api.hanseongge.com;

    ssl_certificate     /etc/letsencrypt/live/api.hanseongge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hanseongge.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 20m;

    # 관리자 API — 고정 IP 제한 (사용자 토큰으로는 어차피 못 들어오지만 한 겹 더 둔다)
    location /api/admin/ {
        # allow  <사무실 고정 IP>;      # TODO: 운영 배포 전 실제 IP 기입
        # deny   all;
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    location = /api/admin/auth/login {
        limit_req zone=login_zone burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    # 결제 콜백 — PG 사 IP 허용목록 (설계서 §11.2 검증 3종 중 ②)
    location /api/v1/payments/callback/ {
        # allow  <PG사 통지 IP 대역>;   # TODO A-3 계약 후 기입
        # deny   all;
        limit_req zone=pay_zone burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    # Swagger / Actuator 는 운영에서 애플리케이션이 이미 끄지만, 경로 자체를 막아 한 겹 더 둔다
    location ~ ^/(swagger-ui|api-docs|actuator) {
        return 404;
    }

    location / {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
