#  =====================================================================
#  배포 — 서버 안의 자체 호스팅 러너가 돈다
#
#  왜 자체 호스팅인가
#    GitHub 가 빌려주는 러너는 IP 가 매번 바뀐다. 그 IP 를 ACG 에 허용하려면
#    GitHub 의 전체 대역을 열어야 하는데, 그건 사실상 인터넷 전체를 여는 것이다.
#
#    자체 호스팅 러너는 서버 안에서 GitHub 로 <b>나가는</b> 연결만 쓴다.
#    22번 포트를 열 필요가 없고, 개발자가 어디서 작업하든 상관이 없다 —
#    배포는 GitHub 버튼 하나로 끝난다(휴대폰에서도 된다).
#
#  ⚠️ 러너는 운영 서버에서 이 저장소의 코드를 실행한다. 저장소에 쓰기 권한이 있는
#     사람은 서버에서 임의 명령을 돌릴 수 있다는 뜻이다. 비공개 저장소이고 접근
#     인원이 적다는 전제 위에 서 있다.
#
#  설치 방법은 docs/TODO_보류항목.md 의 E-6 참조.
#  =====================================================================
name: 배포

on:
  # main 에 푸시하면 자동으로 전체(all)를 배포한다.
  #
  # 대가: main 에 올린 커밋은 곧 운영이다. 작업 중인 코드는 main 에 올리지 않는다.
  # 푸시가 연달아 오면 아래 concurrency 가 겹치지 않게 차례로 돌린다.
  #
  # 수동 실행도 남겨 둔다 — api 나 web 만 다시 올리거나, 실패한 배포를 재시도할 때 쓴다.
  # 손으로 누르던 방식으로 되돌리려면 push 두 줄을 주석 처리한다.
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      target:
        description: 무엇을 배포할지
        required: true
        default: all
        type: choice
        options: [all, api, web]

concurrency:
  # 배포가 겹치면 current 심볼릭 링크를 서로 덮어써 어느 판이 도는지 알 수 없게 된다.
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, hanseongge]
    timeout-minutes: 30

    steps:
      - name: 코드 받기
        # v4 는 Node 20 위에서 도는데 GitHub 이 그것을 종료 예정으로 표시했다.
        # 당장은 러너가 Node 24 로 강제 실행해 주지만 매 배포마다 경고가 쌓이고,
        # 강제 실행이 끝나는 날 조용히 깨진다. 지금 올려 둔다.
        uses: actions/checkout@v5

      - name: 운영 빌드 값 준비
        # NEXT_PUBLIC_* 는 빌드 시점에 번들에 박힌다. 서버 환경변수로는 못 바꾼다.
        #
        # 비밀값이 아니다 — 브라우저 번들에 그대로 보인다. 그런데도 저장소에 두지
        # 않는 이유는 도메인·키가 바뀔 때 코드를 고치지 않기 위해서다.
        # GitHub > Settings > Secrets and variables > Actions > Variables 에 넣는다.
        env:
          API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          MAP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_NAVER_MAP_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE_URL}" ] || [ -z "${SITE_URL}" ]; then
            echo "::error::NEXT_PUBLIC_API_BASE_URL / NEXT_PUBLIC_SITE_URL 변수가 없습니다."
            echo "::error::비어 있으면 번들에 localhost 가 박혀 사이트가 데이터를 못 불러옵니다."
            exit 1
          fi

          # 비어 있지 않다고 쓸 수 있는 값은 아니다. 실제로 겪었다 (2026-09-08):
          # NEXT_PUBLIC_API_BASE_URL 의 값이 <b>변수 이름 그 자체</b>였다.
          # 비어 있지 않으니 위 검사를 통과했고, 번들에는
          #   new URL(path, "NEXT_PUBLIC_API_BASE_URL")
          # 이 박혀 브라우저에서 TypeError: Invalid URL 로 죽었다. 배포는 성공으로
          # 표시되고, 서버 로그에는 아무것도 남지 않는다 — 요청이 브라우저를 떠나지
          # 못하기 때문이다. 화면에는 "잠시 후 다시 시도해 주세요"만 뜬다.
          for pair in "NEXT_PUBLIC_API_BASE_URL=${API_BASE_URL}" "NEXT_PUBLIC_SITE_URL=${SITE_URL}"; do
            name="${pair%%=*}"
            value="${pair#*=}"
            case "$value" in
              https://*|http://*) ;;
              *)
                echo "::error::${name} 이 http(s):// 로 시작하지 않습니다: '${value}'"
                echo "::error::변수 이름이 아니라 주소를 넣어야 합니다 (예: https://api.hanseongge.com)."
                echo "::error::Settings > Secrets and variables > Actions > Variables"
                exit 1
                ;;
            esac
          done
          cat > frontend/.env.production <<EOF
          NEXT_PUBLIC_API_BASE_URL=${API_BASE_URL}
          NEXT_PUBLIC_SITE_URL=${SITE_URL}
          NEXT_PUBLIC_ENV_LABEL=prod
          NEXT_PUBLIC_NAVER_MAP_CLIENT_ID=${MAP_CLIENT_ID}
          EOF

      - name: 실행 권한 확인
        # Windows 에서 커밋하면 실행 비트가 붙지 않는다. 그러면 배포가 exit 126 으로
        # 죽는데, 126 은 "무엇이" 실행 불가인지 알려주지 않는다.
        #
        # 실제로 겪었다 — 이 단계 자리에 chmod +x deploy-local.sh 만 있었고, 정작
        # 죽은 것은 그 <b>안에서</b> 부르는 backend/gradlew 였다. 부르는 쪽에 chmod 를
        # 하나씩 늘리는 방식으로는 스크립트가 늘 때마다 같은 일이 반복된다.
        #
        # 그래서 chmod 로 덮지 않고 여기서 막는다. 고칠 곳은 저장소이지 이 파일이 아니다.
        run: |
          set -euo pipefail
          missing=""
          for f in backend/gradlew infra/deploy/*.sh; do
            [ -x "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::실행 비트가 없는 파일이 있습니다:$missing"
            echo "::error::개발 PC 에서 아래를 실행하고 커밋하세요."
            echo "::error::  git update-index --chmod=+x$missing"
            exit 1
          fi
          echo "실행 권한 확인 완료"

      - name: 배포
        run: infra/deploy/deploy-local.sh "${{ inputs.target || 'all' }}"

      - name: 배포 후 확인
        # 배포 스크립트는 서버 내부(127.0.0.1)만 본다. 밖에서 실제로 응답하는지는
        # 별개 문제다 — nginx 설정이나 인증서가 잘못되면 내부는 멀쩡한데 밖이 막힌다.
        run: |
          set -euo pipefail
          for url in https://hanseongge.com/ https://api.hanseongge.com/api/v1/health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url")
            echo "  $url -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$url 이 200 이 아닙니다 ($code)"
              exit 1
            fi
          done

      - name: 빌드 산출물 정리
        # 러너가 운영 서버에서 돈다. 워크스페이스를 그대로 두면 디스크가 찬다.
        if: always()
        run: |
          rm -rf backend/build frontend/.next frontend/node_modules || true
